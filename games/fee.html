  <style>
    .fee-note{background:var(--surface-2,#eef2ff);border:1px solid var(--border,#e5e7eb);border-radius:14px;padding:16px 18px;margin-bottom:18px;line-height:1.55;font-size:.92rem}
    .fee-note b{color:var(--interactive,#4f46e5)}
    .fee-locked{background:#fef2f2;border-color:#fecaca}
    .fee-locked b{color:#dc2626}
    .fee-card{border:1px solid var(--border,#e5e7eb);border-radius:14px;margin-bottom:12px;overflow:hidden;background:var(--surface,#fff)}
    .fee-card__head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;cursor:pointer;user-select:none}
    .fee-card__m{font-weight:700;font-size:1rem}
    .fee-card__sub{font-size:.8rem;color:var(--text-muted,#64748b);margin-top:2px}
    .fee-card__right{display:flex;align-items:center;gap:12px;flex-shrink:0}
    .fee-card__total{font-weight:800}
    .fee-pill{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}
    .fee-pill--paid{background:#dcfce7;color:#15803d}
    .fee-pill--due{background:#fef9c3;color:#a16207}
    .fee-card__body{border-top:1px solid var(--border,#e5e7eb);padding:14px 18px;display:none}
    .fee-card.is-open .fee-card__body{display:block}
    .fee-line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:.9rem}
    .fee-line--total{border-top:1px dashed var(--border,#e5e7eb);margin-top:6px;padding-top:10px;font-weight:800}
    .fee-caret{transition:transform .2s}
    .fee-card.is-open .fee-caret{transform:rotate(180deg)}
    .fee-wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;font-weight:700;padding:12px 20px;border-radius:12px;text-decoration:none;margin-top:12px}
  </style>
</head>
