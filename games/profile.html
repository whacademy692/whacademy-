<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Audit S2 (CSP). GitHub Pages cannot send HTTP headers, so CSP is per-page.
       frame-ancestors 'none' shuts clickjacking. 'unsafe-inline' kept for inline
       <style>/<script>. Google Fonts allowed (main.css @imports them). connect-src allows the Apps Script API (script.google[usercontent].com) — the page's JS calls it at runtime, so this is required or every API call breaks. img is 'self' data:; widen with https: only if a remote image is ever added. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com">

        <a class="sidebar__item" href="games.html" data-nav-page="games.html">

        <a class="sidebar__item" href="boss-battle.html" data-nav-page="boss-battle.html">

        <a class="sidebar__item" href="revision.html" data-nav-page="revision.html">

    <div style="flex:1; min-width:0;">
      <header class="top-bar hide-desktop"><span class="top-bar__brand">Profile</span></header>

      <main id="main-content" class="app-main">
        <div class="container section">
          <section class="profile-hero">
            <div class="profile-hero__id">
              <div class="avatar avatar--lg profile-hero__avatar" id="profile-avatar" aria-hidden="true">S</div>
              <div class="profile-hero__idtext">
                <span class="badge profile-hero__class" id="profile-class" hidden></span>
                <h1 class="profile-hero__name" id="profile-name">Student</h1>
                <p class="profile-hero__code" id="profile-code">—</p>
              </div>
            </div>
            <div class="profile-hero__stats">
              <div class="profile-hero__stat">
                <span class="profile-hero__stat-value" id="hero-xp">—</span>
                <span class="profile-hero__stat-label">Total XP</span>
              </div>
              <div class="profile-hero__stat">
                <span class="profile-hero__stat-value" id="hero-streak">—</span>
                <span class="profile-hero__stat-label">Day streak</span>
              </div>
            </div>
          </section>

          <div role="tablist" class="profile-tabs" aria-label="Profile sections">
            <button role="tab" class="tab" id="tab-analytics" aria-selected="true" aria-controls="panel-analytics">Analytics</button>
            <button role="tab" class="tab" id="tab-achievements" aria-selected="false" aria-controls="panel-achievements" tabindex="-1">Achievements</button>
            <button role="tab" class="tab" id="tab-certificates" aria-selected="false" aria-controls="panel-certificates" tabindex="-1">Certificates</button>
          </div>

          <div role="tabpanel" id="panel-analytics" aria-labelledby="tab-analytics" class="stack-lg" style="margin-top: var(--space-5);">
            <section id="analytics-weekly" aria-labelledby="weekly-heading">
              <h2 id="weekly-heading" class="profile-section-title">This Week</h2>
              <div class="profile-stats">
                <div class="card card--stat"><span class="card--stat__value" data-field="accuracy">—</span><span class="card--stat__label">Accuracy</span></div>
                <div class="card card--stat"><span class="card--stat__value" data-field="sessions">—</span><span class="card--stat__label">Sessions</span></div>
              </div>
            </section>
            <section id="analytics-monthly" aria-labelledby="monthly-heading">
              <h2 id="monthly-heading" class="profile-section-title">This Month</h2>
              <div class="card profile-month">
                <span data-field="accuracy" class="profile-month__value">—</span>
                <span data-field="delta" class="badge badge--neutral">—</span>
              </div>
            </section>
            <section id="analytics-lifetime" aria-labelledby="lifetime-heading">
              <h2 id="lifetime-heading" class="profile-section-title">Lifetime</h2>
              <div class="profile-stats">
                <div class="card card--stat"><span class="card--stat__value" data-field="streak">—</span><span class="card--stat__label">Longest streak</span></div>
                <div class="card card--stat"><span class="card--stat__value" data-field="certificates">—</span><span class="card--stat__label">Certificates</span></div>
              </div>
            </section>
          </div>

          <div role="tabpanel" id="panel-achievements" aria-labelledby="tab-achievements" hidden style="margin-top: var(--space-5);">
            <div id="achievements-grid" class="card-grid"></div>
          </div>

          <div role="tabpanel" id="panel-certificates" aria-labelledby="tab-certificates" hidden style="margin-top: var(--space-5);">
            <div id="certificates-grid" class="card-grid"></div>
          </div>

          <!-- Mobile-only: the sidebar (with Settings + Log Out) is hidden on
               phones, so surface those here from the account page. -->
          <div class="hide-desktop stack" style="margin-top: var(--space-8);">
            <a class="btn btn--secondary" href="settings.html" data-nav-page="settings.html" style="width:100%;">Settings</a>
            <button class="btn btn--secondary" data-action="logout" style="width:100%;">Log Out</button>
          </div>
        </div>
      </main>
    </div>

  <script>
    document.addEventListener('wha:ready', function () {
      var tabs = Utils.qsa('[role="tab"]');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.setAttribute('aria-selected', 'false'); t.tabIndex = -1; Utils.qs('#' + t.getAttribute('aria-controls')).hidden = true; });
          tab.setAttribute('aria-selected', 'true'); tab.tabIndex = 0;
          Utils.qs('#' + tab.getAttribute('aria-controls')).hidden = false;
        });
        tab.addEventListener('keydown', function (e) {
          var idx = tabs.indexOf(tab);
          if (e.key === 'ArrowRight') tabs[(idx + 1) % tabs.length].focus();
          if (e.key === 'ArrowLeft') tabs[(idx - 1 + tabs.length) % tabs.length].focus();
        });
      });
    });
  </script>
