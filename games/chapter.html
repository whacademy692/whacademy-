<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Audit S2: per-page CSP (GitHub Pages can't send HTTP headers). frame-ancestors
       'none' shuts clickjacking. 'unsafe-inline' kept for script/style because this
       page has an inline token-guard script + inline style attributes. cdnjs is
       allowed for KaTeX (script/style/font — KaTeX pulls its font files from cdnjs
       too). script.google(usercontent).com allowed for the Apps Script API.
       NOTE: img is 'self' data: only — if a chapter's content.json loads a remote
       image, add https: to img-src. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com">
  <title>Chapter — W.H. Academy</title>
  <meta name="theme-color" content="#3730a3">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/pages/chapter.css">
  <!-- KaTeX: renders \( ... \) / \[ ... \] math written inside content.json
       (question prompts, options, theory, explanations). Loaded from CDN so
       no build step is needed; chapter-engine.js no-ops safely if this ever
       fails to load. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <!--
    ONE page for every chapter in the platform.

    Which chapter loads is decided by the query string:
        chapter.html?ch=8/science/human_nervous_system
    which reads:
        classes/8/science/human_nervous_system/content.json

    This replaces the old arrangement where every chapter folder carried its
    own copy of chapter.html + game.js + style.css. That arrangement meant an
    engine bug had to be fixed in as many places as there were chapters, and
    it made the relative asset paths (../../../../../) depend on how deeply a
    chapter folder happened to sit. Here the page never moves, so the paths
    are one level and can never drift.

    A chapter folder now contains exactly one file: content.json.
  -->
  <a href="#chapter-stage-content" class="skip-link">Skip to chapter content</a>

  <div class="app-shell">
    <header class="top-bar">
      <button id="chapter-back" type="button" class="btn btn--icon" aria-label="Back">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <span id="chapter-title" class="top-bar__brand" style="font-family:var(--font-body); font-size:16px;">Loading…</span>
      <span style="width:44px;"></span>
    </header>

    <ol id="stage-stepper" class="stage-stepper" aria-label="Chapter progress"></ol>

    <main id="chapter-stage-content" class="app-main container section" tabindex="-1" style="max-width: 680px;">
      <div class="skeleton skeleton--card"></div>
    </main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    if (!Storage.getToken()) {
      window.location.href = 'login.html';
    }
  </script>
  <script src="assets/js/chapter-engine.js"></script>
</body>
</html>
